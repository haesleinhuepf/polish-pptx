[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polish-pptx"
version = "0.1.0"
description = "CLI tool that polishes diagram-like pptx slides using Claude"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-pptx",
    "render-pptx",
    "anthropic",
    "cairosvg",
    "pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
polish-pptx = "polish_pptx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
